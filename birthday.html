<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Poster</title>
    <link rel="stylesheet" href="style.css">

</head>

<script src="https://cdn.jsdelivr.net/npm/dom-to-image-more/dist/dom-to-image-more.min.js"></script>
<script defer src="app.js"></script>


<body>

    
    <div class="poster">

        <div id="profile">
            <div id="imageWrapper">
                <img id="profileImage"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8qh6bj65apXQ5cNMTGlRUO4JgHCyR0zNNitLecRMgYkfrvbxMuD_rVvQ&s=10">
            </div>
        </div>

        <div class="content">

            <h1>Happy Birthday</h1>

            <h2><div id="name">______</div></h2>

            <p>
                <img src="image/heart.png" width="50">
            </p>

        </div>

    </div>

    <div class="download">
        <div id="downloadBtn">
            <button><img src="image/download.png" width="50"></button>
        </div>
    </div>

    <div id="search">
        <input type="search" id="nameinput" placeholder="Enter your name (e.g. Ankit Kumar)">
    </div>

    <div class="buttons">
        <button id="left">⇦</button>
        <button id="right">⇨</button>
        <button id="top">⇧</button>
        <button id="bottom">⇩</button>
    </div>

    <div id="fitfill">
        <button id="fit"><img src="image/fit.png" width="40"></button>
        <button id="fill"><img src="image/fill.jpg" width="40"></button>
    </div>

    <div class="upload">
        <input type="file" id="imageInput" accept="image/*">
        <div id="title">(UPLOAD IMAGE)</div>
    </div>

    <div class="magnification">
        <button id="zoomIn"><img src="image/zoom-in-button.png" width="25"></button>
        <button id="zoomOut"><img src="image/zoom-out.png" width="25"></button>
    </div>
    
    <div id="move">
        <button id="prev"><</button>
        <button id="next">></button>
    </div>
</body>

</html>
