<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday poster template — neon glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0B0B14;
    --void-soft: #15141F;
    --pink: #FF2E9A;
    --cyan: #26F0E9;
    --yellow: #FDE74C;
    --cream: #F4F2F8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #ECE6DD;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .poster {
    position: relative;
    width: 430px;
    height: 650px;
    overflow: hidden;
    border-radius: 18px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,46,154,.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(38,240,233,.16) 0%, transparent 45%),
      var(--void);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
  }

  /* faint grid lines, ambient depth */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* radiating burst lines behind headline */
  .burst {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 200px;
  }

  .eyebrow {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .headline {
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Bungee', sans-serif;
    font-size: 34px;
    line-height: 1.15;
    color: var(--pink);
    text-shadow:
      0 0 6px rgba(255,46,154,.9),
      0 0 22px rgba(255,46,154,.55),
      0 0 44px rgba(255,46,154,.3);
  }

  .photo-stage {
    position: absolute;
    top: 172px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 250px;
    height: 250px;
  }

  .photo-frame {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    border: 3px solid var(--cyan);
    box-shadow:
      0 0 8px rgba(38,240,233,.8),
      0 0 26px rgba(38,240,233,.4),
      0 0 50px rgba(38,240,233,.2);
  }

  .photo-mask {
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--void-soft);
  }

  /* sparkle marks */
  .spark {
    position: absolute;
    color: var(--yellow);
    font-size: 18px;
    text-shadow: 0 0 8px rgba(253,231,76,.8);
  }

  .age-badge {
    position: absolute;
    bottom: -14px;
    right: -14px;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: var(--void);
    border: 3px solid var(--yellow);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    line-height: 1;
    box-shadow: 0 0 10px rgba(253,231,76,.7), 0 0 26px rgba(253,231,76,.35);
  }
  .age-badge span:first-child {
    font-family: 'Bungee', sans-serif;
    font-size: 18px;
    color: var(--yellow);
  }
  .age-badge span:last-child {
    font-size: 8px;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 2px;
  }

  .details {
    position: absolute;
    top: 452px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 30px;
  }

  .details .name {
    font-family: 'Bungee', sans-serif;
    font-size: 26px;
    color: var(--cream);
  }

  .details .subline {
    margin-top: 12px;
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: .5px;
  }

  .dash-divider {
    width: 70px;
    height: 2px;
    margin: 16px auto 0;
    background: var(--pink);
    box-shadow: 0 0 8px rgba(255,46,154,.7);
  }

  /* bottom neon strip */
  .strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--pink), var(--cyan), var(--yellow));
  }
</style>
</head>
<body>

  <div class="poster">
    <div class="grid"></div>

    <div class="eyebrow">Level up</div>
    <div class="headline">HAPPY<br>BIRTHDAY</div>

    <div class="spark" style="top:150px; left:36px;">✦</div>
    <div class="spark" style="top:190px; right:34px; font-size:14px;">✦</div>
    <div class="spark" style="top:420px; left:50px; font-size:14px;">✦</div>
    <div class="spark" style="top:440px; right:56px;">✦</div>

    <div class="photo-stage">
      <div class="photo-frame"></div>
      <div class="photo-mask"></div>
      <div class="age-badge">
        <span>21</span>
        <span>yrs</span>
      </div>
    </div>

    <div class="details">
      <div class="name">Their name</div>
      <div class="dash-divider"></div>
      <div class="subline">Wishing you the best day ever</div>
    </div>

    <div class="strip"></div>
  </div>

</body>
</html>
