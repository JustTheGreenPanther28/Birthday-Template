<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday poster template — bold pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sunshine: #FFC84B;
    --grape: #6C4AB6;
    --coral: #FF6B5B;
    --cream: #FFF8ED;
    --ink: #2A1E3D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #ECE6DD;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .poster {
    position: relative;
    width: 430px;
    height: 650px;
    overflow: hidden;
    border-radius: 18px;
    background: var(--sunshine);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }

  /* lower color block, offset for asymmetry */
  .block-lower {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 340px;
    background: var(--grape);
    border-top-left-radius: 60px;
  }

  /* squiggle divider between the two blocks */
  .squiggle {
    position: absolute;
    left: 0;
    right: 0;
    top: 306px;
    height: 40px;
  }

  .eyebrow {
    position: absolute;
    top: 44px;
    left: 32px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink);
  }

  .headline {
    position: absolute;
    top: 66px;
    left: 28px;
    right: 28px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 52px;
    line-height: .95;
    color: var(--ink);
  }

  /* tilted polaroid photo, overlapping both color blocks */
  .polaroid {
    position: absolute;
    top: 208px;
    right: 34px;
    width: 210px;
    height: 240px;
    background: var(--cream);
    padding: 14px 14px 40px;
    border-radius: 4px;
    transform: rotate(6deg);
    box-shadow: 0 14px 30px rgba(0,0,0,.28);
  }

  .polaroid .photo-mask {
    width: 100%;
    height: 100%;
    background: #E5D9C8;
    border-radius: 2px;
    overflow: hidden;
  }

  .tape {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    width: 64px;
    height: 24px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.7);
  }

  /* sticker badge, bottom-left overlap */
  .sticker {
    position: absolute;
    left: 30px;
    top: 240px;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: var(--coral);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    line-height: 1;
    transform: rotate(-10deg);
    box-shadow: 0 8px 18px rgba(0,0,0,.22);
  }
  .sticker span:first-child {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--cream);
  }
  .sticker span:last-child {
    font-size: 9px;
    color: var(--cream);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .details {
    position: absolute;
    left: 32px;
    right: 32px;
    bottom: 60px;
  }

  .details .name {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--cream);
    line-height: 1.1;
  }

  .details .subline {
    margin-top: 8px;
    font-size: 13px;
    color: var(--sunshine);
    letter-spacing: .3px;
  }

  /* scattered dot marks, low density, upper block only */
  .dot {
    position: absolute;
    border-radius: 50%;
  }
</style>
</head>
<body>

  <div class="poster">

    <div class="block-lower"></div>

    <svg class="squiggle" viewBox="0 0 430 40" preserveAspectRatio="none">
      <path d="M0 20 Q 20 0, 40 20 T 80 20 T 120 20 T 160 20 T 200 20 T 240 20 T 280 20 T 320 20 T 360 20 T 400 20 T 440 20"
            fill="none" stroke="#6C4AB6" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <div class="dot" style="top:150px; left:36px; width:8px; height:8px; background:var(--coral);"></div>
    <div class="dot" style="top:190px; left:70px; width:5px; height:5px; background:var(--ink); opacity:.5;"></div>
    <div class="dot" style="top:120px; right:60px; width:6px; height:6px; background:var(--cream);"></div>

    <div class="eyebrow">A whole new year</div>
    <div class="headline">Happy<br>Birthday</div>

    <div class="polaroid">
      <div class="tape"></div>
      <div class="photo-mask"></div>
    </div>

    <div class="sticker">
      <span>21</span>
      <span>yrs</span>
    </div>

    <div class="details">
      <div class="name">Their name</div>
      <div class="subline">Wishing you the best day ever</div>
    </div>

  </div>

</body>
</html>
