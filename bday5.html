<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday poster template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --coral: #FF6B81;
    --coral-dark: #E14C63;
    --gold: #F4B942;
    --teal: #2EC4B6;
    --plum: #4A2545;
    --plum-soft: #7A5B72;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #ECE6DD;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .poster {
    position: relative;
    width: 430px;
    height: 650px;
    overflow: hidden;
    border: 5px solid var(--coral);
    border-radius: 18px;
    background: var(--cream);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
  }

  .confetti {
    position: absolute;
    border-radius: 2px;
    opacity: .8;
  }

  .banner {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--coral);
    padding: 10px 28px;
  }
  .banner::before, .banner::after {
    content: "";
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-top: 21px solid var(--coral-dark);
  }
  .banner::before {
    left: -18px;
    border-right: 18px solid transparent;
  }
  .banner::after {
    right: -18px;
    border-left: 18px solid transparent;
  }
  .banner span {
    display: block;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 26px;
    color: var(--cream);
    letter-spacing: .5px;
    white-space: nowrap;
  }

  .photo-stage {
    position: absolute;
    top: 118px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 250px;
  }

  .candle-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 3px dashed var(--gold);
  }

  .photo-mask {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    background: #F1E7DC;
    border: 4px solid var(--cream);
    box-shadow: 0 6px 18px rgba(74, 37, 69, .25);
  }

  .age-badge {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--teal);
    border: 4px solid var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    line-height: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .age-badge span:first-child {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 20px;
    color: var(--cream);
  }
  .age-badge span:last-child {
    font-size: 8px;
    color: var(--cream);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 1px;
  }

  .details {
    position: absolute;
    top: 400px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 30px;
  }

  .details .name {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 34px;
    color: var(--plum);
    line-height: 1.15;
  }

  .details .subline {
    margin-top: 6px;
    font-size: 14px;
    color: var(--plum-soft);
    letter-spacing: .3px;
  }

  .dash-divider {
    width: 90px;
    height: 2px;
    margin: 16px auto 0;
    background-image: repeating-linear-gradient(90deg, var(--coral), var(--coral) 6px, transparent 6px, transparent 12px);
  }

  .scallop {
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 26px;
    background-image: radial-gradient(circle at 12px 0, transparent 12px, var(--coral) 13px);
    background-size: 24px 26px;
    background-repeat: repeat-x;
  }
</style>
</head>
<body>

  <div class="poster">
    <div class="confetti" style="top:70px; left:34px; width:8px; height:8px; background:var(--teal); transform:rotate(20deg);"></div>
    <div class="confetti" style="top:100px; right:40px; width:6px; height:6px; background:var(--gold); border-radius:50%;"></div>
    <div class="confetti" style="bottom:210px; left:28px; width:7px; height:7px; background:var(--coral);"></div>
    <div class="confetti" style="bottom:180px; right:32px; width:8px; height:8px; background:var(--gold); transform:rotate(35deg);"></div>
    <div class="confetti" style="top:380px; left:44px; width:6px; height:6px; background:var(--teal); border-radius:50%;"></div>
    <div class="confetti" style="top:390px; right:44px; width:7px; height:7px; background:var(--coral); transform:rotate(15deg);"></div>

    <div class="banner"><span>Happy Birthday</span></div>

    <div class="photo-stage">
      <div class="candle-ring"></div>
      <div class="photo-mask"></div>
      <div class="age-badge">
        <span>21</span>
        <span>years</span>
      </div>
    </div>

    <div class="details">
      <div class="name">Their name</div>
      <div class="dash-divider"></div>
      <div class="subline">Wishing you the best day ever</div>
    </div>

    <div class="scallop"></div>
  </div>

</body>
</html>
