<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday poster template — vintage gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-deep: #2E1420;
    --plum-mid: #3D1B2B;
    --gold: #D4AF6A;
    --gold-soft: #E8CB94;
    --cream: #F6EDE0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #ECE6DD;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
  }

  .poster {
    position: relative;
    width: 430px;
    height: 650px;
    overflow: hidden;
    border: 2px solid var(--gold);
    border-radius: 6px;
    background: radial-gradient(circle at 50% 20%, var(--plum-mid) 0%, var(--plum-deep) 70%);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
  }

  /* inner hairline frame, vintage card convention */
  .inner-frame {
    position: absolute;
    inset: 14px;
    border: 1px solid var(--gold);
    opacity: .55;
  }

  /* corner flourishes */
  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    border: 1.5px solid var(--gold);
  }
  .corner.tl { top: 22px; left: 22px; border-right: none; border-bottom: none; }
  .corner.tr { top: 22px; right: 22px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px; border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px; border-left: none; border-top: none; }

  .eyebrow {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .headline {
    position: absolute;
    top: 76px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 40px;
    color: var(--cream);
    letter-spacing: 1px;
  }

  .rule {
    position: absolute;
    top: 128px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 1px;
    background: var(--gold);
  }
  .rule::before, .rule::after {
    content: "";
    position: absolute;
    top: -3px;
    width: 6px;
    height: 6px;
    border: 1px solid var(--gold);
    transform: rotate(45deg);
  }
  .rule::before { left: -10px; }
  .rule::after { right: -10px; }

  .photo-stage {
    position: absolute;
    top: 160px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 220px;
  }

  /* laurel wreath, built from two rows of angled leaf marks */
  .laurel {
    position: absolute;
    inset: -34px;
  }
  .leaf {
    position: absolute;
    width: 10px;
    height: 4px;
    background: var(--gold);
    border-radius: 0 60% 0 60%;
    opacity: .85;
  }

  .photo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 6px var(--plum-deep), 0 0 0 7px var(--gold-soft);
  }

  .photo-mask {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    overflow: hidden;
    background: #4A2F3B;
  }

  .details {
    position: absolute;
    top: 424px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 40px;
  }

  .details .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--cream);
    line-height: 1.15;
    font-style: italic;
  }

  .details .subline {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .age-line {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--gold-soft);
    letter-spacing: 3px;
  }
  .age-line span {
    color: var(--cream);
    font-weight: 700;
  }
</style>
</head>
<body>

  <div class="poster">
    <div class="inner-frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="eyebrow">Celebrating another year</div>
    <div class="headline">Happy Birthday</div>
    <div class="rule"></div>

    <div class="photo-stage">
      <div class="laurel">
        <div class="leaf" style="top:6px; left:2px; transform:rotate(-30deg);"></div>
        <div class="leaf" style="top:0px; left:14px; transform:rotate(-15deg);"></div>
        <div class="leaf" style="top:-4px; left:28px; transform:rotate(-2deg);"></div>
        <div class="leaf" style="top:6px; right:2px; transform:rotate(30deg);"></div>
        <div class="leaf" style="top:0px; right:14px; transform:rotate(15deg);"></div>
        <div class="leaf" style="top:-4px; right:28px; transform:rotate(2deg);"></div>
        <div class="leaf" style="bottom:6px; left:2px; transform:rotate(30deg);"></div>
        <div class="leaf" style="bottom:0px; left:14px; transform:rotate(15deg);"></div>
        <div class="leaf" style="bottom:-4px; left:28px; transform:rotate(2deg);"></div>
        <div class="leaf" style="bottom:6px; right:2px; transform:rotate(-30deg);"></div>
        <div class="leaf" style="bottom:0px; right:14px; transform:rotate(-15deg);"></div>
        <div class="leaf" style="bottom:-4px; right:28px; transform:rotate(-2deg);"></div>
      </div>
      <div class="photo-ring"></div>
      <div class="photo-mask"></div>
    </div>

    <div class="age-line">Turning <span>21</span></div>

    <div class="details">
      <div class="name">Their name</div>
      <div class="subline">Wishing you the best day ever</div>
    </div>
  </div>

</body>
</html>
