<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday poster maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="indexstyle.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bungee&family=Cormorant+Garamond:wght@600;700&family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<script defer src="app.js"></script>
<body>

  <div class="poster" id="poster" data-theme="ribbon">

    <!-- theme 1 -->
    <div class="decor decor-ribbon">
      <div class="confetti" style="top:70px; left:34px; width:8px; height:8px; background:var(--teal); transform:rotate(20deg);"></div>
      <div class="confetti" style="top:100px; right:40px; width:6px; height:6px; background:var(--gold); border-radius:50%;"></div>
      <div class="confetti" style="bottom:210px; left:28px; width:7px; height:7px; background:var(--coral);"></div>
      <div class="banner"><span>Happy Birthday</span></div>
      <div class="candle-ring"></div>
      <div class="scallop"></div>
    </div>

    <!-- theme 2 -->
    <div class="decor decor-balloon">
      <div class="cloud" style="width:90px; height:26px; top:16px; left:-20px;"></div>
      <div class="cloud" style="width:70px; height:20px; top:60px; right:-16px;"></div>
      <div class="balloon" style="left:24px; top:150px; width:46px; height:58px; background:var(--teal); transform:rotate(-8deg);"></div>
      <div class="balloon" style="right:26px; top:170px; width:46px; height:58px; background:var(--gold); transform:rotate(6deg);"></div>
      <div class="bunting">
        <div class="string"></div>
        <div class="flag" style="left:40px;"></div>
        <div class="flag" style="left:100px; border-top-color:var(--gold);"></div>
        <div class="flag" style="left:160px; border-top-color:var(--teal);"></div>
        <div class="flag" style="left:220px; border-top-color:var(--violet);"></div>
        <div class="flag" style="left:280px;"></div>
        <div class="flag" style="left:340px; border-top-color:var(--gold);"></div>
      </div>
      <div class="photo-ring"></div>
      <div class="title">It's party time</div>
      <div class="confetti" style="bottom:40px; left:36px; width:7px; height:7px; background:var(--coral);"></div>
    </div>

    <!-- theme 3 -->
    <div class="decor decor-vintage">
      <div class="inner-frame"></div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="eyebrow">Celebrating another year</div>
      <div class="headline">Happy Birthday</div>
      <div class="rule"></div>
      <div class="age-line">Turning <span id="ageDisplayVintage">21</span></div>
    </div>

    <!-- theme 4 -->
    <div class="decor decor-boldpop">
      <div class="block-lower"></div>
      <svg class="squiggle" viewBox="0 0 430 40" preserveAspectRatio="none">
        <path d="M0 20 Q 20 0, 40 20 T 80 20 T 120 20 T 160 20 T 200 20 T 240 20 T 280 20 T 320 20 T 360 20 T 400 20 T 440 20" fill="none" stroke="#6C4AB6" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="eyebrow">A whole new year</div>
      <div class="headline">Happy<br>Birthday</div>
      <div class="tape"></div>
      <div class="dot" style="top:150px; left:36px; width:8px; height:8px; background:var(--coral);"></div>
    </div>

    <!-- theme 5 -->
    <div class="decor decor-neon">
      <div class="grid"></div>
      <div class="eyebrow">Level up</div>
      <div class="headline">HAPPY<br>BIRTHDAY</div>
      <div class="spark" style="top:150px; left:36px;">&#10022;</div>
      <div class="spark" style="top:190px; right:34px; font-size:14px;">&#10022;</div>
      <div class="strip"></div>
    </div>

    <!-- shared functional nodes -->
    <div class="photo-stage" id="photoStage">
      <div class="photo-mask" id="photoMask">
        <img id="profileImage" src="" alt="" style="display:none;">
        <div class="photo-placeholder" id="photoPlaceholder">Upload a photo</div>
      </div>
      <div class="age-badge" id="ageBadge">
        <span id="ageDisplay">21</span>
        <span>years</span>
      </div>
    </div>

    <div class="details" id="details">
      <div class="name" id="nameDisplay">Their name</div>
      <div class="dash-divider"></div>
      <div class="subline" id="messageDisplay">Wishing you the best day ever</div>
    </div>

  </div>

  <div class="controls">
    <h2>Customize</h2>

    <div class="field">
      <label for="themeSelect">Theme</label>
      <select id="themeSelect">
        <option value="ribbon">Ribbon &amp; candles</option>
        <option value="balloon">Balloon sky</option>
        <option value="vintage">Vintage gold</option>
        <option value="boldpop">Bold pop</option>
        <option value="neon">Neon glow</option>
      </select>
    </div>

    <div class="field">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="Their name">
    </div>

    <div class="field">
      <label for="ageInput">Age</label>
      <input type="number" id="ageInput" placeholder="21" min="0">
    </div>

    <div class="field">
      <label for="messageInput">Message</label>
      <input type="text" id="messageInput" placeholder="Wishing you the best day ever">
    </div>

    <div class="field">
      <label for="imageInput">Photo</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="btn-row">
      <button id="fit">Fit</button>
      <button id="fill">Fill</button>
    </div>
    <div class="btn-row">
      <button id="zoomOut">Zoom -</button>
      <button id="zoomIn">Zoom +</button>
    </div>

    <button class="download-btn" id="downloadBtn">Download poster</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

</body>
</html>
